name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db # the build imports the DB client, which needs a URL
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci # also runs `prisma generate` via postinstall
      - run: npm run lint
      - run: npm test
      - run: npm run build
